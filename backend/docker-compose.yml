services:
  api:
    image: node:20-alpine
    container_name: skillswap_api
    working_dir: /app
    ports:
      - "4000:4000"
    env_file:
      - .env
    volumes:
      - .:/app
    command: sh -c "npm install --include=dev && npx prisma generate && npm run dev"
    depends_on:
      - mongodb
      - redis

  mongodb:
    image: mongo:6
    container_name: skillswap_mongodb
    command: mongod --replSet rs0 --bind_ip_all
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db

  redis:
    image: redis:7
    container_name: skillswap_redis

volumes:
  mongodb_data:
