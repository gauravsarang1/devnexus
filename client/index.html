<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SkillSwap | Premium AI-Powered Skill Exchange for India</title>
    <meta name="title" content="SkillSwap | Premium AI-Powered Skill Exchange for India" />
    <meta name="description" content="Join India's fastest-growing skill exchange community. Trade your expertise in React, UI/UX, or Marketing. No fees, real peer-to-peer growth and building." />
    <meta name="keywords" content="skill exchange, peer learning, learn react india, mentorship, free skill sharing, gen-z learning platform" />
    <meta name="author" content="SkillSwap Team" />
    <link rel="canonical" href="https://skillswap.ai" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://skillswap.ai/" />
    <meta property="og:title" content="SkillSwap | Swap Skills & Build Your Future" />
    <meta property="og:description" content="Trade your skills 1:1. You teach UI, they teach API dev. Join the premium peer-to-peer learning marketplace." />
    <meta property="og:image" content="https://skillswap.ai/og-image.jpg" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://skillswap.ai/" />
    <meta property="twitter:title" content="SkillSwap | Swap Skills & Build Your Future" />
    <meta property="twitter:description" content="Trade your skills 1:1. You teach UI, they teach API dev. Join the premium peer-to-peer learning marketplace." />
    <meta property="twitter:image" content="https://skillswap.ai/og-image.jpg" />

    <!-- JSON-LD Structured Data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "SkillSwap",
        "operatingSystem": "Web",
        "applicationCategory": "EducationApplication",
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "INR"
        },
        "description": "A premium 1:1 skill exchange platform for Indian Gen-Z to trade knowledge directly without money.",
        "aggregateRating": {
          "@type": "AggregateRating",
          "ratingValue": "4.9",
          "reviewCount": "1200"
        }
      }
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'Plus Jakarta Sans', sans-serif;
        scroll-behavior: smooth;
        background-color: #ffffff;
      }
      .glass {
        background: rgba(255, 255, 255, 0.7);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        border: 1px solid rgba(255, 255, 255, 0.2);
      }
      .blue-glow {
        box-shadow: 0 0 40px -10px rgba(59, 130, 246, 0.3);
      }
      .custom-scrollbar::-webkit-scrollbar {
        width: 6px;
      }
      .custom-scrollbar::-webkit-scrollbar-track {
        background: transparent;
      }
      .custom-scrollbar::-webkit-scrollbar-thumb {
        background: #e2e8f0;
        border-radius: 10px;
      }
      .scrollbar-hide::-webkit-scrollbar {
        display: none;
      }
      .scrollbar-hide {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
